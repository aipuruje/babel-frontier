name = "archive-of-tongues-mvp"
main = "src/index.ts"
compatibility_date = "2026-01-09"
compatibility_flags = ["nodejs_compat"]

# IMPORTANT:
# 1) Run ./setup.ps1 once to create D1 + KV and populate this file.
# 2) Or manually set database_id below.
#
# Secrets to set:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put SESSION_SIGNING_KEY

[[d1_databases]]
binding = "DB"
database_name = "archive_of_tongues"
database_id = "__REPLACE_WITH_D1_ID__"

[[kv_namespaces]]
binding = "SESSIONS"
id = "__REPLACE_WITH_KV_ID__"

# Brain Pack KV Namespace (stores version pointer)
[[kv_namespaces]]
binding = "KV"
id = "" # Create with: wrangler kv namespace create brain
preview_id = "" # Create with: wrangler kv namespace create brain --preview

# Brain Pack R2 Bucket (stores brain pack JSONs)
[[r2_buckets]]
binding = "R2"
bucket_name = "babel-frontier-brain"
preview_bucket_name = "babel-frontier-brain-preview"
